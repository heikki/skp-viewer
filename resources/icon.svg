<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3B4B6B"/>
      <stop offset="100%" stop-color="#1E2A3E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <linearGradient id="wallLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7F3EE"/>
      <stop offset="100%" stop-color="#EDE7DE"/>
    </linearGradient>
    <linearGradient id="wallRight" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#D5CEC4"/>
      <stop offset="100%" stop-color="#C8C0B4"/>
    </linearGradient>
    <linearGradient id="roofRight" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#B8402E"/>
      <stop offset="100%" stop-color="#A43828"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.48" cy="0.48" r="0.35">
      <stop offset="0%" stop-color="rgba(120,140,180,0.15)"/>
      <stop offset="100%" stop-color="rgba(120,140,180,0)"/>
    </radialGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D8F0"/>
      <stop offset="100%" stop-color="#8CBEE0"/>
    </linearGradient>
    <linearGradient id="windowGlowSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90B8D4"/>
      <stop offset="100%" stop-color="#78A0BC"/>
    </linearGradient>
    <linearGradient id="floorLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A3550"/>
      <stop offset="100%" stop-color="#232D42"/>
    </linearGradient>
    <linearGradient id="floorRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252F46"/>
      <stop offset="100%" stop-color="#1F283C"/>
    </linearGradient>
    <!-- Gable wall (triangle above left wall) - slightly darker than left wall -->
    <linearGradient id="gableLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EBE5DC"/>
      <stop offset="100%" stop-color="#E0D8CE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#grid)"/>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#glow)"/>

  <!-- House - isometric, centered and scaled up -->
  <g transform="translate(490, 460) scale(1.3)">

    <!-- === FLOOR === -->
    <polygon points="-180,330 0,230 0,330 -180,430" fill="url(#floorLeft)"/>
    <polygon points="0,230 200,320 200,420 0,330" fill="url(#floorRight)"/>
    <line x1="-180" y1="330" x2="-180" y2="430" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <line x1="200" y1="320" x2="200" y2="420" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <line x1="-180" y1="430" x2="0" y2="330" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="0" y1="330" x2="200" y2="420" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

    <!-- === WALLS === -->
    <polygon points="-180,60 0,-40 0,230 -180,330" fill="url(#wallLeft)"/>
    <polygon points="0,-40 200,50 200,320 0,230" fill="url(#wallRight)"/>

    <!-- === GABLE ROOF (two slopes, ridge runs left-right) === -->
    <!-- Left wall gable triangle (above left wall) -->
    <polygon points="-180,60 -90,-40 0,-40 -180,60" fill="url(#gableLeft)"/>
    <!-- Actually: gable is the triangular part above the wall at each end -->
    <!-- Ridge runs from left-wall midpoint to right-wall midpoint -->
    <!-- Left gable triangle: top of left wall + peak -->
    <polygon points="-180,60 0,-40 -90,-90" fill="url(#gableLeft)"/>
    <!-- Right gable triangle (visible on right side) -->
    <polygon points="0,-40 200,50 100,0" fill="url(#wallRight)"/>

    <!-- Right roof slope (visible) -->
    <polygon points="-90,-90 100,0 200,50 0,-40" fill="url(#roofRight)"/>
    <!-- Left roof slope (visible, facing us) - slightly lighter -->
    <polygon points="-90,-90 -180,60 0,-40" fill="#D4513E"/>

    <!-- Roof overhang: extend slightly beyond walls -->
    <!-- Front overhang (left slope, visible face) -->
    <polygon points="-100,-100 -200,65 -180,60 0,-40 -90,-90" fill="#D95740" opacity="0.0"/>

    <!-- Roof ridge line -->
    <line x1="-90" y1="-90" x2="100" y2="0" stroke="#9E3425" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left slope eave -->
    <line x1="-180" y1="60" x2="-90" y2="-90" stroke="#B8402E" stroke-width="2" stroke-linecap="round"/>
    <line x1="-180" y1="60" x2="0" y2="-40" stroke="rgba(180,80,60,0.4)" stroke-width="1.5"/>
    <!-- Right slope eave -->
    <line x1="0" y1="-40" x2="100" y2="0" stroke="rgba(140,50,35,0.5)" stroke-width="1.5"/>
    <line x1="200" y1="50" x2="100" y2="0" stroke="#8E2E20" stroke-width="2" stroke-linecap="round"/>

    <!-- === DOOR (left wall) === -->
    <g transform="translate(-105, 140)">
      <polygon points="0,0 45,-25 45,100 0,125" fill="#7A6245"/>
      <polygon points="3,3 42,-22 42,97 3,122" fill="#8B7355"/>
      <ellipse cx="35" cy="55" rx="3" ry="3.5" fill="#C8A860"/>
    </g>

    <!-- === WINDOWS (left wall) === -->
    <g transform="translate(-155, 90)">
      <polygon points="0,0 45,-25 45,30 0,55" fill="url(#windowGlow)" opacity="0.9"/>
      <polygon points="0,0 45,-25 45,30 0,55" fill="none" stroke="#B8B0A4" stroke-width="2"/>
      <line x1="22" y1="-12" x2="22" y2="43" stroke="#B8B0A4" stroke-width="1.2"/>
      <line x1="0" y1="27" x2="45" y2="2" stroke="#B8B0A4" stroke-width="1.2"/>
    </g>
    <g transform="translate(-50, 110)">
      <polygon points="0,0 40,-22 40,28 0,50" fill="url(#windowGlow)" opacity="0.9"/>
      <polygon points="0,0 40,-22 40,28 0,50" fill="none" stroke="#B8B0A4" stroke-width="2"/>
      <line x1="20" y1="-11" x2="20" y2="39" stroke="#B8B0A4" stroke-width="1.2"/>
      <line x1="0" y1="25" x2="40" y2="3" stroke="#B8B0A4" stroke-width="1.2"/>
    </g>

    <!-- === WINDOWS (right wall) === -->
    <g transform="translate(50, 50)">
      <polygon points="0,0 50,18 50,68 0,50" fill="url(#windowGlowSide)" opacity="0.85"/>
      <polygon points="0,0 50,18 50,68 0,50" fill="none" stroke="#A8A098" stroke-width="2"/>
      <line x1="25" y1="9" x2="25" y2="59" stroke="#A8A098" stroke-width="1.2"/>
      <line x1="0" y1="25" x2="50" y2="43" stroke="#A8A098" stroke-width="1.2"/>
    </g>
    <g transform="translate(120, 80)">
      <polygon points="0,0 50,18 50,68 0,50" fill="url(#windowGlowSide)" opacity="0.85"/>
      <polygon points="0,0 50,18 50,68 0,50" fill="none" stroke="#A8A098" stroke-width="2"/>
      <line x1="25" y1="9" x2="25" y2="59" stroke="#A8A098" stroke-width="1.2"/>
      <line x1="0" y1="25" x2="50" y2="43" stroke="#A8A098" stroke-width="1.2"/>
    </g>

    <!-- === EDGE HIGHLIGHTS === -->
    <line x1="0" y1="-40" x2="0" y2="230" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>
    <line x1="-180" y1="330" x2="0" y2="230" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>
    <line x1="0" y1="230" x2="200" y2="320" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>

    <!-- === VERTEX DOTS (3D viewer feel) === -->
    <circle cx="-90" cy="-90" r="3.5" fill="rgba(255,255,255,0.35)"/>
    <circle cx="100" cy="0" r="3.5" fill="rgba(255,255,255,0.3)"/>
    <circle cx="-180" cy="60" r="2.5" fill="rgba(255,255,255,0.2)"/>
    <circle cx="200" cy="50" r="2.5" fill="rgba(255,255,255,0.2)"/>
    <circle cx="0" cy="-40" r="2.5" fill="rgba(255,255,255,0.2)"/>
    <circle cx="-180" cy="330" r="2.5" fill="rgba(255,255,255,0.15)"/>
    <circle cx="200" cy="320" r="2.5" fill="rgba(255,255,255,0.15)"/>
    <circle cx="0" cy="230" r="2.5" fill="rgba(255,255,255,0.15)"/>
    <circle cx="-180" cy="430" r="2.5" fill="rgba(255,255,255,0.1)"/>
    <circle cx="200" cy="420" r="2.5" fill="rgba(255,255,255,0.1)"/>
    <circle cx="0" cy="330" r="2.5" fill="rgba(255,255,255,0.1)"/>
  </g>
</svg>
