<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>

    <!-- Top face gradient - brightest -->
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>

    <!-- Left face gradient - medium -->
    <linearGradient id="left" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5cd6"/>
      <stop offset="100%" stop-color="#5b3a8c"/>
    </linearGradient>

    <!-- Right face gradient - darkest -->
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d4db8"/>
      <stop offset="100%" stop-color="#4a2d78"/>
    </linearGradient>

    <!-- Subtle glow behind cube -->
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.4">
      <stop offset="0%" stop-color="rgba(102,126,234,0.2)"/>
      <stop offset="100%" stop-color="rgba(102,126,234,0)"/>
    </radialGradient>

    <!-- Edge highlight -->
    <filter id="edgeGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>

  <!-- Cube centered at 512, 500 -->
  <g transform="translate(512, 500)">

    <!-- Drop shadow -->
    <ellipse cx="0" cy="175" rx="200" ry="40" fill="rgba(0,0,0,0.25)"/>

    <!-- Top face -->
    <polygon points="0,-260 260,-130 0,0 -260,-130" fill="url(#top)"/>

    <!-- Left face -->
    <polygon points="0,0 -260,-130 -260,130 0,260" fill="url(#left)"/>

    <!-- Right face -->
    <polygon points="0,0 260,-130 260,130 0,260" fill="url(#right)"/>

    <!-- Edge highlights (bright lines along edges) -->
    <!-- Top edges -->
    <line x1="0" y1="-260" x2="260" y2="-130" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <line x1="0" y1="-260" x2="-260" y2="-130" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="260" y1="-130" x2="0" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <line x1="-260" y1="-130" x2="0" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

    <!-- Vertical edges -->
    <line x1="0" y1="0" x2="0" y2="260" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
    <line x1="-260" y1="-130" x2="-260" y2="130" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <line x1="260" y1="-130" x2="260" y2="130" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"/>

    <!-- Bottom edges -->
    <line x1="-260" y1="130" x2="0" y2="260" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
    <line x1="260" y1="130" x2="0" y2="260" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>

    <!-- Letter S on left face: skewY(30deg) scaleX(0.866) -->
    <g transform="translate(-130,50) skewY(30) scale(0.866, 1)">
      <text x="0" y="10" text-anchor="middle" dominant-baseline="central"
            font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif"
            font-weight="800" font-size="200" fill="rgba(255,255,255,0.85)">S</text>
    </g>

    <!-- Letter K on right face: skewY(-30deg) scaleX(0.866) -->
    <g transform="translate(130,50) skewY(-30) scale(0.866, 1)">
      <text x="0" y="10" text-anchor="middle" dominant-baseline="central"
            font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif"
            font-weight="800" font-size="200" fill="rgba(255,255,255,0.7)">K</text>
    </g>

    <!-- Letter P on top face: rotate(-30) skewX(30) scaleY(0.866) -->
    <g transform="translate(0,-145) rotate(-30) skewX(30) scale(1, 0.866)">
      <text x="0" y="10" text-anchor="middle" dominant-baseline="central"
            font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif"
            font-weight="800" font-size="200" fill="rgba(255,255,255,0.9)">P</text>
    </g>

    <!-- Vertex dots -->
    <circle cx="0" cy="-260" r="4" fill="rgba(255,255,255,0.5)"/>
    <circle cx="260" cy="-130" r="3.5" fill="rgba(255,255,255,0.35)"/>
    <circle cx="-260" cy="-130" r="3.5" fill="rgba(255,255,255,0.3)"/>
    <circle cx="0" cy="0" r="3" fill="rgba(255,255,255,0.2)"/>
    <circle cx="260" cy="130" r="3" fill="rgba(255,255,255,0.15)"/>
    <circle cx="-260" cy="130" r="3" fill="rgba(255,255,255,0.15)"/>
    <circle cx="0" cy="260" r="3" fill="rgba(255,255,255,0.1)"/>
  </g>
</svg>
